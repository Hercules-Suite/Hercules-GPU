<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Hercules octree emblem</title>
  <description id="description">An H assembled from gradually graded square octree cells, with two centered gold mesh cells joined by a seismic waveform.</description>

  <g fill="#327795">
    <!-- Left column: coarse -> medium -> fine -> medium -> coarse. -->
    <rect data-octree-cell="true" x="44" y="6" width="104" height="104" rx="10"/>

    <rect data-octree-cell="true" x="44" y="118" width="49" height="49" rx="5"/>
    <rect data-octree-cell="true" x="99" y="118" width="49" height="49" rx="5"/>

    <rect data-octree-cell="true" x="44" y="175" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="71" y="175" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="98" y="175" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="125" y="175" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="44" y="202" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="71" y="202" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="98" y="202" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="125" y="202" width="23" height="23" rx="3"/>

    <rect data-octree-cell="true" x="44" y="231" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="71" y="231" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="44" y="258" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="71" y="258" width="23" height="23" rx="3"/>

    <rect data-octree-cell="true" x="44" y="287" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="71" y="287" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="98" y="287" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="125" y="287" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="44" y="314" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="71" y="314" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="98" y="314" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="125" y="314" width="23" height="23" rx="3"/>

    <rect data-octree-cell="true" x="44" y="345" width="49" height="49" rx="5"/>
    <rect data-octree-cell="true" x="99" y="345" width="49" height="49" rx="5"/>

    <rect data-octree-cell="true" x="44" y="402" width="104" height="104" rx="10"/>

    <!-- Right column uses the same graded transition. -->
    <rect data-octree-cell="true" x="364" y="6" width="104" height="104" rx="10"/>

    <rect data-octree-cell="true" x="364" y="118" width="49" height="49" rx="5"/>
    <rect data-octree-cell="true" x="419" y="118" width="49" height="49" rx="5"/>

    <rect data-octree-cell="true" x="364" y="175" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="391" y="175" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="418" y="175" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="445" y="175" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="364" y="202" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="391" y="202" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="418" y="202" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="445" y="202" width="23" height="23" rx="3"/>

    <rect data-octree-cell="true" x="418" y="231" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="445" y="231" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="418" y="258" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="445" y="258" width="23" height="23" rx="3"/>

    <rect data-octree-cell="true" x="364" y="287" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="391" y="287" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="418" y="287" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="445" y="287" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="364" y="314" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="391" y="314" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="418" y="314" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="445" y="314" width="23" height="23" rx="3"/>

    <rect data-octree-cell="true" x="364" y="345" width="49" height="49" rx="5"/>
    <rect data-octree-cell="true" x="419" y="345" width="49" height="49" rx="5"/>

    <rect data-octree-cell="true" x="364" y="402" width="104" height="104" rx="10"/>
  </g>

  <path
    d="M148 256 L166 256 C180 256 184 249 190 235 L202 205 L222 300 L250 175 L280 340 L306 220 L323 274 C330 294 339 286 347 263 C350 257 356 256 364 256"
    fill="none"
    stroke="#D9A441"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="30"
  />

  <!-- These terminals replace octree cells instead of overlaying the meshes. -->
  <g fill="#D9A441">
    <rect data-octree-cell="true" data-wave-terminal="true" x="98" y="231" width="50" height="50" rx="5"/>
    <rect data-octree-cell="true" data-wave-terminal="true" x="364" y="231" width="50" height="50" rx="5"/>
  </g>
</svg>
