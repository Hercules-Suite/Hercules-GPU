<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Hercules octree emblem</title>
  <description id="description">An H assembled from square adaptive octree cells, with two gold mesh cells joined by a seismic waveform.</description>

  <g fill="#327795">
    <!-- Left column: coarse, level-1, level-2, coarse square cells. -->
    <rect data-octree-cell="true" x="44" y="36" width="104" height="104" rx="10"/>

    <rect data-octree-cell="true" x="44" y="148" width="49" height="49" rx="5"/>
    <rect data-octree-cell="true" x="99" y="148" width="49" height="49" rx="5"/>
    <rect data-octree-cell="true" x="44" y="203" width="49" height="49" rx="5"/>

    <rect data-octree-cell="true" x="44" y="260" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="71" y="260" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="98" y="260" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="125" y="260" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="44" y="287" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="71" y="287" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="98" y="287" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="125" y="287" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="44" y="314" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="71" y="314" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="98" y="314" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="125" y="314" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="44" y="341" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="71" y="341" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="98" y="341" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="125" y="341" width="23" height="23" rx="3"/>

    <rect data-octree-cell="true" x="44" y="372" width="104" height="104" rx="10"/>

    <!-- Right column mirrors the refinement transition. -->
    <rect data-octree-cell="true" x="364" y="36" width="104" height="104" rx="10"/>

    <rect data-octree-cell="true" x="364" y="148" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="391" y="148" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="418" y="148" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="445" y="148" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="364" y="175" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="391" y="175" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="418" y="175" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="445" y="175" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="418" y="202" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="445" y="202" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="418" y="229" width="23" height="23" rx="3"/>
    <rect data-octree-cell="true" x="445" y="229" width="23" height="23" rx="3"/>

    <rect data-octree-cell="true" x="364" y="260" width="49" height="49" rx="5"/>
    <rect data-octree-cell="true" x="419" y="260" width="49" height="49" rx="5"/>
    <rect data-octree-cell="true" x="364" y="315" width="49" height="49" rx="5"/>
    <rect data-octree-cell="true" x="419" y="315" width="49" height="49" rx="5"/>

    <rect data-octree-cell="true" x="364" y="372" width="104" height="104" rx="10"/>
  </g>

  <path
    d="M148 228 L166 228 C180 228 184 221 190 207 L202 177 L222 272 L250 147 L280 312 L306 192 L323 246 C330 266 339 258 347 235 C350 229 356 228 364 228"
    fill="none"
    stroke="#D9A441"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="30"
  />

  <!-- These terminals replace octree cells instead of overlaying the meshes. -->
  <g fill="#D9A441">
    <rect data-octree-cell="true" data-wave-terminal="true" x="99" y="203" width="49" height="49" rx="5"/>
    <rect data-octree-cell="true" data-wave-terminal="true" x="364" y="203" width="49" height="49" rx="5"/>
  </g>
</svg>
