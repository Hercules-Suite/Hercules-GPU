<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
<title id="title">legacy: full versus sqd coordinates</title>
<desc id="desc">Two dry-land columns have ground elevations 0 and 100 m. With base 1000 m, the same interface at elevation -40 m has solver Z=1040 m. Legacy full stores 1040 and 1040 m; legacy sqd stores depths 40 and 140 m. With topography off, legacy uses fixed solver coordinates.</desc>
<rect width="920" height="520" fill="white"/>
<text x="28" y="30" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#1c3044" text-anchor="start" font-weight="700">legacy (default): the existing topography convention selects the reference</text><text x="28" y="55" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#53687b" text-anchor="start" font-weight="400">No <tspan font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15.3">seabed_geometry_file</tspan>. Both panels show the same horizontal layer at elevation −40 m.</text><path d="M460 80 L460 445" fill="none" stroke="#bdcbd5" stroke-width="1"/><text x="230" y="92" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="13" fill="#1c3044" text-anchor="middle" font-weight="700">include_topography=yes · type_of_etree=full</text><path d="M35 142 L420 142" fill="none" stroke="#bdcbd5" stroke-width="1" stroke-dasharray="6 5"/><text x="40" y="130" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#126b8c" text-anchor="start" font-weight="400">Solver Z=0 at H=+1000 m</text><text x="40" y="171" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#53687b" text-anchor="start" font-weight="400">// Upper air omitted</text><rect x="80" y="310" width="105" height="80" fill="#efe4cf"/><path d="M80 310 L185 310" fill="none" stroke="#1c3044" stroke-width="2"/><text x="132" y="298" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1c3044" text-anchor="middle" font-weight="400">Ground H=+0</text><path d="M70 350 L225 350" fill="none" stroke="#a44515" stroke-width="2" stroke-dasharray="6 4"/><circle cx="132" cy="350" r="5" fill="#a44515"/><path d="M205 142 L205 350" fill="none" stroke="#126b8c" stroke-width="2.5"/><circle cx="205" cy="142" r="4" fill="#126b8c"/><path d="M200 342 L205 350 L210 342" stroke="#126b8c" stroke-width="2.5" fill="none"/><rect x="198" y="177" width="14" height="20" fill="white"/><path d="M200 181 l10 -4 m-10 14 l10 -4" stroke="#126b8c" stroke-width="2"/><rect x="62" y="406" width="158" height="36" fill="#f4f7f9" stroke="#bdcbd5"/><text x="141" y="430" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="17" fill="#126b8c" text-anchor="middle" font-weight="700">z.in=1040 m</text><rect x="270" y="210" width="105" height="180" fill="#efe4cf"/><path d="M270 210 L375 210" fill="none" stroke="#1c3044" stroke-width="2"/><text x="322" y="198" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1c3044" text-anchor="middle" font-weight="400">Ground H=+100</text><path d="M260 350 L415 350" fill="none" stroke="#a44515" stroke-width="2" stroke-dasharray="6 4"/><circle cx="322" cy="350" r="5" fill="#a44515"/><path d="M395 142 L395 350" fill="none" stroke="#126b8c" stroke-width="2.5"/><circle cx="395" cy="142" r="4" fill="#126b8c"/><path d="M390 342 L395 350 L400 342" stroke="#126b8c" stroke-width="2.5" fill="none"/><rect x="388" y="177" width="14" height="20" fill="white"/><path d="M390 181 l10 -4 m-10 14 l10 -4" stroke="#126b8c" stroke-width="2"/><rect x="252" y="406" width="158" height="36" fill="#f4f7f9" stroke="#bdcbd5"/><text x="331" y="430" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="17" fill="#126b8c" text-anchor="middle" font-weight="700">z.in=1040 m</text><text x="230" y="374" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#a44515" text-anchor="middle" font-weight="400">Same layer: H=−40 m, Z=1040 m</text><text x="690" y="92" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="13" fill="#1c3044" text-anchor="middle" font-weight="700">include_topography=yes · type_of_etree=sqd</text><path d="M495 142 L880 142" fill="none" stroke="#bdcbd5" stroke-width="1" stroke-dasharray="6 5"/><text x="500" y="130" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#53687b" text-anchor="start" font-weight="400">Solver Z=0 at H=+1000 m</text><text x="500" y="171" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#53687b" text-anchor="start" font-weight="400">// Upper air omitted</text><rect x="540" y="310" width="105" height="80" fill="#efe4cf"/><path d="M540 310 L645 310" fill="none" stroke="#1c3044" stroke-width="2"/><text x="592" y="298" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1c3044" text-anchor="middle" font-weight="400">Ground H=+0</text><path d="M530 350 L685 350" fill="none" stroke="#a44515" stroke-width="2" stroke-dasharray="6 4"/><circle cx="592" cy="350" r="5" fill="#a44515"/><path d="M665 310 L665 350" fill="none" stroke="#126b8c" stroke-width="2.5"/><circle cx="665" cy="310" r="4" fill="#126b8c"/><path d="M660 342 L665 350 L670 342" fill="none" stroke="#126b8c" stroke-width="2.5"/><rect x="522" y="406" width="158" height="36" fill="#f4f7f9" stroke="#bdcbd5"/><text x="601" y="430" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="17" fill="#126b8c" text-anchor="middle" font-weight="700">z.in=40 m</text><rect x="730" y="210" width="105" height="180" fill="#efe4cf"/><path d="M730 210 L835 210" fill="none" stroke="#1c3044" stroke-width="2"/><text x="782" y="198" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1c3044" text-anchor="middle" font-weight="400">Ground H=+100</text><path d="M720 350 L875 350" fill="none" stroke="#a44515" stroke-width="2" stroke-dasharray="6 4"/><circle cx="782" cy="350" r="5" fill="#a44515"/><path d="M855 210 L855 350" fill="none" stroke="#126b8c" stroke-width="2.5"/><circle cx="855" cy="210" r="4" fill="#126b8c"/><path d="M850 342 L855 350 L860 342" fill="none" stroke="#126b8c" stroke-width="2.5"/><rect x="712" y="406" width="158" height="36" fill="#f4f7f9" stroke="#bdcbd5"/><text x="791" y="430" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="17" fill="#126b8c" text-anchor="middle" font-weight="700">z.in=140 m</text><text x="690" y="374" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#a44515" text-anchor="middle" font-weight="400">Same layer: H=−40 m, Z=1040 m</text><text x="28" y="479" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#53687b" text-anchor="start" font-weight="400">With topography disabled, legacy uses fixed solver coordinates; <tspan font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15.3">type_of_etree</tspan> is unused.</text><text x="28" y="506" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#1c3044" text-anchor="start" font-weight="700">Changing full ↔ sqd without converting z.in changes the physical material model.</text>
</svg>
