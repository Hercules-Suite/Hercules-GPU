<text x="540" y="864" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#53687b" text-anchor="middle">Shading: intended terrain-following layer. Colored dots: column samples. Vertical scale exaggerated.</text>
