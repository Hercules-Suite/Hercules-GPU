<path d="M76 278 L436 278" stroke="#1a69a1" stroke-width="2.8" fill="none" stroke-dasharray="8 5"/>
<circle cx="76" cy="278" r="6" fill="white" stroke="#1a69a1" stroke-width="2.5"/>
<circle cx="436" cy="278" r="6" fill="white" stroke="#1a69a1" stroke-width="2.5"/>
<path d="M436 284 L436 320" stroke="#1a69a1" stroke-width="2" fill="none" stroke-dasharray="3 4"/>
<rect x="432" y="316" width="8" height="8" rx="0" fill="#f7e6b6" stroke="#1a69a1"/>
<text x="270" y="193" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#1a69a1" text-anchor="start">30 m above B&#x27;s surface</text>
<text x="270" y="215" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#1a69a1" text-anchor="start">B uses its first material value</text>
<path d="M417 225 L435 266" stroke="#1a69a1" stroke-width="1" fill="none"/>
<circle cx="256" cy="250" r="3" fill="white" stroke="#1c3044" stroke-width="1.5"/>
<path d="M260 250 L282 250" stroke="#1c3044" stroke-width="1" fill="none"/>
<path d="M282 250 L282 278" stroke="#1c3044" stroke-width="1" fill="none"/>
<path d="M278 278 L286 278" stroke="#1c3044" stroke-width="1" fill="none"/>
<text x="290" y="269" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1c3044" text-anchor="start">20 m</text>
<circle cx="256" cy="278" r="7" fill="#ffc547" stroke="#1c3044" stroke-width="2"/>
<text x="267" y="304" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1c3044" text-anchor="start">query: h = 30 m</text>
<path d="M76 462 L436 462" stroke="#90a2b4" stroke-width="1" fill="none"/>
<path d="M76 457 L76 467" stroke="#90a2b4" stroke-width="1" fill="none"/>
<path d="M436 457 L436 467" stroke="#90a2b4" stroke-width="1" fill="none"/>
<text x="256" y="486" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#53687b" text-anchor="middle">500 m · query halfway</text>
<text x="28" y="520" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#53687b" text-anchor="start">READ AT COLUMN A</text>
<text x="270" y="520" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#53687b" text-anchor="start">READ AT COLUMN B</text>
<text x="28" y="546" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1a69a1" text-anchor="start">70 m → rock</text>
<text x="270" y="546" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1a69a1" text-anchor="start">−30 m → first layer</text>
<text x="28" y="571" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#1c3044" text-anchor="start">1500 m/s</text>
<text x="270" y="571" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#1c3044" text-anchor="start">300 m/s</text>
<rect x="28" y="590" width="448" height="78" rx="8" fill="#eef5fb" stroke="none"/>
<text x="252" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#1a69a1" text-anchor="middle">½ × 1500 + ½ × 300</text>
<text x="252" y="650" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#1a69a1" text-anchor="middle">Vₛ = 900 m/s</text>
<text x="252" y="695" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#53687b" text-anchor="middle">Blends rock and soft material at equal elevation.</text>
</g>
<g transform="translate(552 120)">
<rect x="0" y="0" width="504" height="714" rx="12" fill="white" stroke="#cbd5df"/>
<text x="28" y="38" font-family="Consolas,Liberation Mono,monospace" font-size="23" font-weight="700" fill="#14775c" text-anchor="start">SAME_DEPTH</text>
<text x="28" y="67" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#53687b" text-anchor="start">Keep depth below each surface fixed</text>
<text x="28" y="98" font-family="Consolas,Liberation Mono,monospace" font-size="16" font-weight="400" fill="#14775c" text-anchor="start">d_i = d = 20 m</text>
<rect x="76" y="160" width="360" height="288" rx="0" fill="#f1f7fb" stroke="none"/>
<path d="M76 180 L436 320 L436 390 L76 250 Z" fill="#f7e6b6"/>
<path d="M76 250 L436 390 L436 448 L76 448 Z" fill="#dde3e9"/>
<text x="24" y="141" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#53687b" text-anchor="start">h (m)</text>
