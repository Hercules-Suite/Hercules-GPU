<text x="76" y="145" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1c3044" text-anchor="start">A: ground at 100 m</text>
<text x="436" y="145" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1c3044" text-anchor="end">B: ground at 0 m</text>
