<text x="252" y="650" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#14775c" text-anchor="middle">Vₛ = 300 m/s</text>
<text x="252" y="695" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#53687b" text-anchor="middle">Preserves this constant-thickness soft layer.</text>
