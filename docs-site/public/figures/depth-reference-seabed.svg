<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
<title id="title">seabed: measure from each ground or bed</title>
<desc id="desc">Example with topographybase_zcoord=1000 m. Profiles A, B and C have outer elevations 100, 0, 0 m and bed elevations 100, -40, -100 m. The same layer at elevation -120 m is encoded in z.in as 220, 80, 20 m. Upper air is omitted with a marked axis break.</desc>
<rect width="920" height="520" fill="white"/>
