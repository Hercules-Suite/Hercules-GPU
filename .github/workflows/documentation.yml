name: Documentation site

on:
  pull_request:
    paths:
      - "docs-site/**"
      - "quake/forward/**"
      - "benchmark_inputs/**"
      - "script/**"
      - "doc/**"
      - "README.md"
      - "run_phaseA_phaseB.sh"
      - ".github/workflows/documentation.yml"
  push:
    branches:
      - main
    paths:
      - "docs-site/**"
      - "quake/forward/**"
      - "benchmark_inputs/**"
      - "script/**"
      - "doc/**"
      - "README.md"
      - "run_phaseA_phaseB.sh"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site

    steps:
      - name: Check out Hercules_GPU
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test documentation
        run: pnpm test

      - name: Build and test GitHub Pages export
        env:
          NEXT_PUBLIC_DOCS_BASE_PATH: /${{ github.event.repository.name }}
          DOCS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: pnpm run test:pages

      - name: Preserve the deployable build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hercules-documentation-build
          path: docs-site/dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private && vars.DOCS_PAGES_ENABLED == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site/out

  deploy-pages:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private && vars.DOCS_PAGES_ENABLED == 'true' }}
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
