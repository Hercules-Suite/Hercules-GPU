name: DRM and station flat output

on:
  pull_request:
    paths:
      - "quake/forward/drm_output_*.h"
      - "quake/forward/io_drm.*"
      - "quake/forward/flat_output_mpi.h"
      - "quake/forward/psolve.cc"
      - "quake/forward/topography.cc"
      - "benchmark_inputs/drm_flat_output/**"
      - ".github/workflows/drm-output.yml"
  push:
    branches: [main]
    paths:
      - "quake/forward/drm_output_*.h"
      - "quake/forward/io_drm.*"
      - "quake/forward/flat_output_mpi.h"
      - "quake/forward/psolve.cc"
      - "quake/forward/topography.cc"
      - "benchmark_inputs/drm_flat_output/**"
      - ".github/workflows/drm-output.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-and-mpi-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MPI
        run: sudo apt-get update && sudo apt-get install -y mpich libmpich-dev
      - name: Check DRM box parsing and generated geometry
        run: |
          c++ -std=c++11 -Wall -Wextra -pedantic benchmark_inputs/drm_flat_output/points_test.cc -o /tmp/drm-points-test
          /tmp/drm-points-test
      - name: Compile production station interpolation regression
        run: |
          python3 benchmark_inputs/drm_flat_output/extract_station_test.py /tmp/station_functions.inc
          mpicxx.mpich -std=c++11 -Wall -Wextra -pedantic -fopenmp -DSTATION_TEST_MPI -I/tmp benchmark_inputs/drm_flat_output/station_test.cc -o /tmp/station-test
      - name: Check real MPI-IO ordering and batching
        # Hosted runners do not expose usable RDMA devices. Keep this small
        # host-buffer MPI-IO regression on TCP/self, independent of RDMA.
        env:
          UCX_TLS: tcp,self
          OMP_NUM_THREADS: 2
        run: |
          mpicxx.mpich -std=c++11 -Wall -Wextra -pedantic benchmark_inputs/drm_flat_output/mpi_writer_test.cc -o /tmp/drm-mpi-test
          mpirun.mpich -np 1 /tmp/drm-mpi-test /tmp/drm-one.bin
          mpirun.mpich -np 4 /tmp/drm-mpi-test /tmp/drm-four.bin
          cmp /tmp/drm-one.bin /tmp/drm-four.bin
          cmp /tmp/drm-one.bin.box0 /tmp/drm-four.bin.box0
          cmp /tmp/drm-one.bin.box1 /tmp/drm-four.bin.box1
          mpirun.mpich -np 1 /tmp/station-test /tmp/station-one.bin
          mpirun.mpich -np 4 /tmp/station-test /tmp/station-four.bin
          cmp /tmp/station-one.bin /tmp/station-four.bin
